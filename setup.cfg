[metadata]
name = fire-tablet-cleaner
version = 0.1.0
description = Safe, reversible Fire tablet manager and lightweight launcher
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
package_dir =
    = desktop
packages = find:
python_requires = >=3.9

[options.packages.find]
where = desktop

[options.entry_points]
console_scripts =
    fire-tablet-manager = firemanager.gui:main
    fire-tablet-manager-cli = firemanager.cli:main
